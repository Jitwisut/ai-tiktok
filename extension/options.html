<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>AI Affiliate Studio — Extension Settings</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 480px;
        margin: 32px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        margin-top: 16px;
        font-size: 13px;
        font-weight: 600;
      }
      input {
        width: 100%;
        margin-top: 4px;
        padding: 8px;
        box-sizing: border-box;
        font-size: 13px;
      }
      button {
        margin-top: 20px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        color: #16a34a;
      }
      p.hint {
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h2>AI Affiliate Studio — ตั้งค่า Extension</h2>
    <p class="hint">
      ค่า Extension Token ต้องตรงกับ EXTENSION_UPLOAD_TOKEN ใน .env ของแอป
      ไม่งั้นการอัปโหลดวิดีโอกลับจะถูกปฏิเสธ
    </p>

    <label for="appBaseUrl">App Base URL</label>
    <input id="appBaseUrl" type="text" placeholder="http://localhost:3000" />

    <label for="extensionToken">Extension Token</label>
    <input id="extensionToken" type="text" placeholder="วางค่าเดียวกับ EXTENSION_UPLOAD_TOKEN" />

    <label for="flowProjectUrl">Google Flow project URL</label>
    <input id="flowProjectUrl" type="text" placeholder="https://flow.google.com/project/..." />
    <p class="hint">
      ใช้เฉพาะตอนเลือกสร้างที่ Flow — เปิดโปรเจกต์ใน Flow แล้วคัดลอก URL มาวาง
    </p>

    <button id="save">บันทึก</button>
    <div id="status"></div>

    <script src="dist/options.js"></script>
  </body>
</html>
