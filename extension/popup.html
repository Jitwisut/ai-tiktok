<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>AI Affiliate Studio</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 380px;
        margin: 0;
        padding: 14px;
        color: #111827;
        background: #fff;
      }
      h1 {
        font-size: 14px;
        margin: 0;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .link {
        font-size: 11px;
        color: #2563eb;
        cursor: pointer;
        text-decoration: underline;
        background: none;
        border: none;
        padding: 0;
      }
      .duration {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .duration label {
        font-weight: 600;
      }
      .duration select {
        flex: 1;
        padding: 4px 6px;
        font-size: 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
      }
      .hint {
        font-size: 11px;
        color: #6b7280;
        margin: 0 0 10px;
        line-height: 1.5;
      }
      #progress {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
        background: #f9fafb;
      }
      .progress-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .bar-track {
        height: 5px;
        background: #e5e7eb;
        border-radius: 999px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: #111827;
        transition: width 0.3s;
      }
      .job {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 8px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .job img {
        width: 40px;
        height: 40px;
        object-fit: cover;
        border-radius: 6px;
        background: #f3f4f6;
        flex-shrink: 0;
      }
      .job-info {
        flex: 1;
        min-width: 0;
      }
      .job-name {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .job-hook,
      .job-meta {
        font-size: 11px;
        color: #6b7280;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .job-meta {
        margin-top: 2px;
        color: #2563eb;
      }
      button.run {
        background: #111827;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        flex-shrink: 0;
      }
      button.run:disabled {
        background: #9ca3af;
        cursor: default;
      }
      .msg {
        font-size: 12px;
        color: #6b7280;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>งานวิดีโอที่รออยู่</h1>
      <button class="link" id="openOptions">ตั้งค่า</button>
    </div>

    <div class="duration">
      <label for="duration">ความยาว</label>
      <select id="duration">
        <option value="8">8 วินาที (1 คลิป)</option>
        <option value="16">16 วินาที (2 คลิป)</option>
        <option value="24">24 วินาที (3 คลิป)</option>
        <option value="32">32 วินาที (4 คลิป)</option>
      </select>
    </div>
    <p class="hint">
      Veo สร้างได้ครั้งละ 8 วินาที ระบบจะสร้างหลายคลิปต่อกันโดยใช้เฟรมสุดท้ายของคลิปก่อนหน้าเป็นภาพเริ่มต้น
      แล้วแอปจะต่อเป็นไฟล์เดียวให้
    </p>

    <div id="progress" hidden></div>
    <div id="content"><p class="msg">กำลังโหลด...</p></div>

    <script src="dist/popup.js"></script>
  </body>
</html>
